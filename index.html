<script>

const dishes = [
    { name: "Gilded Shore Risotto", cookTimeHr: 8, exp: 4, prices: { legendary: 288, epic: 208, rare: 160 } },
    { name: "Farmstead Feast Roast", cookTimeHr: 6, exp: 3, prices: { legendary: 216, epic: 156, rare: 120 } },
    { name: "Woodland Mushroom Risotto", cookTimeHr: 4, exp: 2, prices: { legendary: 130, epic: 94, rare: 72 } },
    { name: "Braised Venison Stew", cookTimeHr: 8, exp: 4, prices: { legendary: 317, epic: 229, rare: 176 } },
    { name: "Hearty Custard Pie", cookTimeHr: 6, exp: 3, prices: { legendary: 194, epic: 140, rare: 108 } },
    { name: "Paleleaf Meat Roll", cookTimeHr: 6, exp: 3, prices: { legendary: 238, epic: 172, rare: 132 } },
    { name: "Saltbaked Shrimp", cookTimeHr: 6, exp: 3, prices: { legendary: 216, epic: 156, rare: 120 } },
    { name: "Wild Herb Tomahawk", cookTimeHr: 12, exp: 6, prices: { legendary: 475, epic: 343, rare: 264 } },
    { name: "Simple Seared Scallops", cookTimeHr: 8, exp: 4, prices: { legendary: 317, epic: 229, rare: 176 } },
    { name: "Hearthroast Chicken", cookTimeHr: 4, exp: 2, prices: { legendary: 144, epic: 104, rare: 80 } },
    { name: "Deepwater Ink Pasta", cookTimeHr: 10, exp: 5, prices: { legendary: 468, epic: 338, rare: 260 } },
    { name: "Golden Cream Pasta", cookTimeHr: 8, exp: 4, prices: { legendary: 346, epic: 250, rare: 192 } }
];

const levels = ["Kitchen Hand I", "Kitchen Hand II", "Kitchen Hand III", "Apprentice Cook I", "Apprentice Cook II", "Apprentice Cook III", "Sous Chef I", "Sous Chef II", "Sous Chef III", "Head Chef I", "Head Chef II", "Head Chef III", "Culinary Virtuoso I", "Culinary Virtuoso II", "Culinary Virtuoso III", "Master of Flavour I", "Master of Flavour II", "Master of Flavour III", "MAX"];
const expPerLevel = {"Kitchen Hand I": 0, "Kitchen Hand II": 10, "Kitchen Hand III": 20, "Apprentice Cook I": 40, "Apprentice Cook II": 80, "Apprentice Cook III": 120, "Sous Chef I": 160, "Sous Chef II": 240, "Sous Chef III": 280, "Head Chef I": 320, "Head Chef II": 400, "Head Chef III": 500, "Culinary Virtuoso I": 600, "Culinary Virtuoso II": 700, "Culinary Virtuoso III": 800, "Master of Flavour I": 900, "Master of Flavour II": 1000, "Master of Flavour III": 1200, "MAX": 1400};
const talentTimeReduction = { 0: 0, 1: 0.05, 2: 0.10, 3: 0.15, 4: 0.20, 5: 0.25 };
const researchTaskMap = {
  0: ["🍳 60 any quality", "💰 30 Epic+", "🍳 20 Legendary", "🍳 100 in gauntlet (3+ recipes)"],
  1: ["🍳 60 Epic+", "💰 10 Legendary", "🍳 200 in gauntlet (3+ recipes)", "🍽️ 1"],
  2: ["🍳 80 Legendary", "🍳 200 in gauntlet (3+ recipes)", "🍳 5 in 1 gauntlet (3+ recipes) * 20", "🍽️ 1"],
  3: ["🍳 80 any quality", "💰 10 Legendary", "Complete 30 gauntlets (2400+ score)", "🎁 1"],
  4: ["🍳 100 any quality", "Complete 150 gauntlets", "🍳 5 in 1 gauntlet (3+ recipes)", "💰 20 Legendary"],
  5: ["🍳 80 any quality", "Complete 150 gauntlets", "🍳5 in 1 gauntlet (3+ recipes) * 20", "💰 10 Legendary"],
  6: ["🍳 100 any quality", "Complete 150 gauntlets", "🍳 5 in 1 gauntlet (3+ recipes)", "💰 20 Legendary"],
  7: ["🍳 80 Epic+", "💰 20 Legendary", "🍳 150 in gauntlet (3+ recipes)", "🍽️ 1"],
  8: ["🍳 100 any quality", "💰 20 Legendary", "Complete 10 gauntlets (2400+ score)", "🎁 1"],
  9: ["🍳 200 any quality", "Complete 70 gauntlets (2400+ score)", "💁 Flaunt * 1", "💰 10 Legendary"],
  10: ["🍳 50 Legendary", "🍳 200 in gauntlet (3+ recipes)", "🍳 5 in 1 gauntlet (3+ recipes)", "💰 100 any quality"],
  11: ["🍳 150 any quality", "💰 40 any quality", "Complete 40 gauntlets (2400+ score)", "🍳5 in 1 gauntlet (3+ recipes) * 20"],
};

function getDishImagePath(dishName) {
    const imageName = dishName.toLowerCase();
    return `images/${imageName}.png`;
}

function copyToClipboard(text) {
    const textarea = document.createElement('textarea');
    textarea.value = text;
    textarea.style.position = 'fixed'; 
    textarea.style.opacity = 0;
    document.body.appendChild(textarea);
    textarea.select();
    try {
        document.execCommand('copy');
    } catch (err) {
        console.error('Fallback: Oops, unable to copy', err);
    }
    document.body.removeChild(textarea);
}

function switchTab(tabId) {
  const tabs = ["expTab", "researchTab", "profitTab", "harvestTab"];
  tabs.forEach(t => {
      const el = document.getElementById(t);
      if (el) el.style.display = t === tabId ? 'block' : 'none';
  });
  document.querySelectorAll('.tab').forEach(tab => tab.classList.remove('active'));
  const activeTab = document.querySelector(`.tab[onclick="switchTab('${tabId}')"]`);
  if (activeTab) activeTab.classList.add('active');
}


function runCalculation() {
    const currentIndex = levels.indexOf(document.getElementById('currentLevel').value);
    const targetIndex = levels.indexOf(document.getElementById('targetLevel').value);
    let progress = parseFloat(document.getElementById('progress').value) || 0;
    const talentLevel = parseInt(document.getElementById('talentLevel').value);
    const delegatoLevel = parseInt(document.getElementById('delegatoLevel').value);
    const resultDiv = document.getElementById('result');

    if (currentIndex === -1 || targetIndex === -1 || targetIndex <= currentIndex) {
        resultDiv.textContent = 'Please select valid levels.';
        return;
    }

    const selectedDishCheckboxes = document.querySelectorAll('#dishSelectionContainer input[type="checkbox"]:checked');
    if (selectedDishCheckboxes.length === 0) {
        resultDiv.textContent = 'Please select at least one dish to cook.';
        return;
    }
    const selectedDishNames = Array.from(selectedDishCheckboxes).map(cb => cb.value);
    const availableDishes = dishes.filter(dish => selectedDishNames.includes(dish.name));
    
    const dishesByExp = {};
    availableDishes.forEach(dish => {
        if (!dishesByExp[dish.exp]) dishesByExp[dish.exp] = [];
        dishesByExp[dish.exp].push(dish);
    });
    const expValues = Object.keys(dishesByExp).map(Number).sort((a, b) => b - a);
    const maxExpFromOneDish = expValues.length > 0 ? expValues[0] : 0;

 
    let totalExpNeeded = 0;
    for (let i = currentIndex + 1; i <= targetIndex; i++) {
        totalExpNeeded += expPerLevel[levels[i]];
    }
    totalExpNeeded -= progress;
    if (totalExpNeeded < 0) totalExpNeeded = 0;

    const reduction = 1 - (talentTimeReduction[talentLevel] || 0);

    const dpArraySize = totalExpNeeded + maxExpFromOneDish;
    const dp = Array(dpArraySize).fill(null);
    dp[0] = { time: 0, combo: {} };

    for (const exp of expValues) {
        const dishInfo = dishesByExp[exp][0];
        const cookTime = dishInfo.cookTimeHr;

        for (let i = exp; i < dpArraySize; i++) {
            if (dp[i - exp] !== null) {
                const newTime = dp[i - exp].time + cookTime;
                if (dp[i] === null || newTime < dp[i].time) {
                    const newCombo = { ...dp[i - exp].combo };
                    newCombo[exp] = (newCombo[exp] || 0) + 1;
                    dp[i] = { time: newTime, combo: newCombo };
                }
            }
        }
    }

    let bestSolution = null;
    for (let i = totalExpNeeded; i < dpArraySize; i++) {
        if (dp[i] !== null) {
            bestSolution = { exp: i, time: dp[i].time, combo: dp[i].combo };
            break;
        }
    }

    if (!bestSolution) {
        resultDiv.textContent = "Could not find a combination of selected dishes to reach the target EXP.";
        return;
    }

    const totalCookTime = bestSolution.time * reduction;
    const realTime = totalCookTime / (delegatoLevel + 1);
    const days = Math.floor(realTime / 24);
    const hours = Math.round(realTime % 24);

    const makeImageHTML = (dishes, count) => {
      const seen = new Set();
      let html = `${count} × `;
      for (const dish of dishes) {
        if (seen.has(dish.name)) continue;
        seen.add(dish.name);
        const imgPath = getDishImagePath(dish.name);
        html += `<img src="${imgPath}" title="${dish.name}" style="max-width:40px;max-height:40px;margin:2px;vertical-align:middle;object-fit:contain;">`;
      }
      return html + '<br>';
    };

    let output = `EXP needed: ${totalExpNeeded} (Achieved: ${bestSolution.exp})<br><br><b>Optimal Combo:</b><br>`;

    for (const exp in bestSolution.combo) {
        const count = bestSolution.combo[exp];
        const dishGroup = dishesByExp[exp];
        output += makeImageHTML(dishGroup, count);
    }
    output += `<br><b>Total time:</b> ${days} day(s) and ${hours} hour(s)`;

    resultDiv.innerHTML = output;
}

function setupSelectAll() {
    const selectAllCheckbox = document.getElementById('selectAllCheckbox');
    const dishContainer = document.getElementById('dishSelectionContainer');
    if (!selectAllCheckbox) return;
    selectAllCheckbox.addEventListener('change', function() {
        const dishCheckboxes = dishContainer.querySelectorAll('input[type="checkbox"]:not(#selectAllCheckbox)');
        dishCheckboxes.forEach(checkbox => {
            checkbox.checked = this.checked;
        });
    });
    dishContainer.addEventListener('change', function(event) {
        if (event.target.id !== 'selectAllCheckbox') {
            const dishCheckboxes = dishContainer.querySelectorAll('input[type="checkbox"]:not(#selectAllCheckbox)');
            const totalDishes = dishCheckboxes.length;
            const checkedDishes = Array.from(dishCheckboxes).filter(cb => cb.checked).length;
            selectAllCheckbox.checked = totalDishes === checkedDishes;
        }
    });
}


function calculateTime() {
  const recipeIndex = parseInt(document.getElementById('recipeSelect').value);
  const dishCount = parseInt(document.getElementById('dishAmount').value);
  const flameLevel = parseInt(document.getElementById('timeTalentLevel').value);
  const delegato = parseInt(document.getElementById('timeDelegatoLevel').value);
  const reduction = 1 - talentTimeReduction[flameLevel];

  const totalCookTime = dishes[recipeIndex].cookTimeHr * dishCount * reduction;
  const parallel = delegato + 1;
  const realTime = totalCookTime / parallel;
  const days = Math.floor(realTime / 24);
  const hours = Math.round(realTime % 24);
  const totalExp = dishCount * dishes[recipeIndex].exp;

  document.getElementById('timeResult').textContent =
    `Total EXP: ${totalExp}\n\n` +
    `Total time: ${days} day(s) and ${hours} hour(s)`;
}


function calculateHarvestTimes() {
  const baseTime = new Date(document.getElementById("startTime").value);
  if (isNaN(baseTime)) {
    alert("Please enter a valid start time.");
    return;
  }

  const talent = parseInt(document.getElementById("harvestTalent").value);
  const reduction = 1 - talentTimeReduction[talent];
  const wrappers = document.querySelectorAll(".dish-group");

  const hoursInput = document.getElementById('commissionHours').value;
  const minutesInput = document.getElementById('commissionMinutes').value;
  const commissionTimeLeftMinutes = (parseInt(hoursInput) || 0) * 60 + (parseInt(minutesInput) || 0);

  let cumulativeTimeMs = 0;
  let totalExp = 0;

  wrappers.forEach((wrapper, index) => {
    const sel = wrapper.querySelector(".dishOption");
    const resultDiv = wrapper.querySelector(".timestamp");
    resultDiv.innerHTML = "";
    if (!sel.value) {
      resultDiv.style.display = "none";
      return;
    }

    const dish = dishes[parseInt(sel.value)];
    let cookTimeMs = dish.cookTimeHr * 3600000 * reduction;

    if (index === 0 && commissionTimeLeftMinutes > 0) {
      cookTimeMs = commissionTimeLeftMinutes * 60000;
    }

    cumulativeTimeMs += cookTimeMs;
    totalExp += dish.exp;

    const readyTime = new Date(baseTime.getTime() + cumulativeTimeMs);
    const timestampUnix = Math.floor(readyTime.getTime() / 1000);
    const discordTimestamp = `<t:${timestampUnix}:t>`;
    const copyContent = `${dish.name} → ${discordTimestamp}`;

    const months = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
    const formattedTime = `${months[readyTime.getMonth()]} ${readyTime.getDate().toString().padStart(2, '0')} ${readyTime.getHours().toString().padStart(2, '0')}:${readyTime.getMinutes().toString().padStart(2, '0')}`;

    resultDiv.innerHTML = `${formattedTime} <img class="copy-image" src="https://cdn-icons-png.flaticon.com/512/60/60990.png" alt="Copy" title="Copy timestamp" onclick="copyToClipboard('${copyContent}')" />`;
    resultDiv.setAttribute("data-discord", copyContent);
    resultDiv.style.display = "flex";
  });

  const expDiv = document.getElementById("harvestTotalExp");

  if (totalExp > 0) {
    const oldIcon = expDiv.querySelector("img.copy-image");
    if (oldIcon) oldIcon.remove();

    const copyAllImage = document.createElement("img");
    copyAllImage.src = "https://cdn-icons-png.flaticon.com/512/60/60990.png";
    copyAllImage.alt = "Copy All";
    copyAllImage.className = "copy-image";

function calculateProfit() {
    const weeklyBudget = parseInt(document.getElementById('weekly-budget').value, 10) || 0;
    const hvaBudget = parseInt(document.getElementById('hva-budget').value, 10) || 0;
    const shopMultiplier = parseFloat(document.getElementById('shop-level').value);
    const recipeRefinerCap = parseFloat(document.getElementById('recipe-refiner-level').value);
    const recipesCompleted = parseInt(document.getElementById('recipes-completed').value, 10) || 0;
    const profitsModeCap = parseFloat(document.getElementById('profits-mode-level').value);
    const researchTasksCompleted = parseInt(document.getElementById('research-tasks-completed').value, 10) || 0;
    const recipeRefinerBonus = Math.min(recipesCompleted * 0.01, recipeRefinerCap);
    const profitsModeBonus = Math.min(researchTasksCompleted * 0.01, profitsModeCap);
    
    let allItems = [];
    let itemUID = 0;

    dishes.forEach((dish, index) => {
        const isHVA = document.getElementById(`hva-check-${index}`).checked;
        const quantities = {
            legendary: parseInt(document.getElementById(`quantity-${index}-legendary`).value, 10) || 0,
            epic: parseInt(document.getElementById(`quantity-${index}-epic`).value, 10) || 0,
            rare: parseInt(document.getElementById(`quantity-${index}-rare`).value, 10) || 0,
        };

        for (const quality in quantities) {
            const quantity = quantities[quality];
            if (quantity > 0) {
                const basePrice = dish.prices[quality];
                const priceWithTalents = basePrice * (1 + recipeRefinerBonus) * (1 + profitsModeBonus);
                for (let i = 0; i < quantity; i++) {
                    allItems.push({
                        uid: itemUID++,
                        name: dish.name,
                        quality: quality,
                        isHVA: isHVA,
                        hvaPrice: Math.floor(priceWithTalents * shopMultiplier),
                        regularPrice: Math.floor(priceWithTalents)
                    });
                }
            }
        }
    });

    const hvaItemsForKnapsack = allItems
        .filter(item => item.isHVA)
        .map(item => ({ ...item, price: item.hvaPrice }));

    const hvaResult = runKnapsack(hvaItemsForKnapsack, hvaBudget);
    const usedHvaUIDs = new Set(hvaResult.items.map(item => item.uid));

    const regularItemsForKnapsack = allItems
        .filter(item => !usedHvaUIDs.has(item.uid))
        .map(item => ({ ...item, price: item.regularPrice }));
        
    const weeklyResult = runKnapsack(regularItemsForKnapsack, weeklyBudget);

    const resultContainer = document.getElementById('result-container');
    let finalHTML = formatProfitResults('HVA Sales', hvaResult, hvaBudget);
    finalHTML += formatProfitResults('Regular Sales', weeklyResult, weeklyBudget);
    const totalGold = hvaResult.value + weeklyResult.value;
    finalHTML += `<div class="total-gold">Total: ${totalGold.toFixed(0)}</div>`;
    resultContainer.innerHTML = finalHTML;
}

const runKnapsack = (items, budget) => {
    const intBudget = Math.floor(budget);
    if (intBudget <= 0 || items.length === 0) return { value: 0, items: [] };

    let dp = Array(intBudget + 1).fill(null).map(() => ({ value: 0, items: [] }));

    for (const item of items) {
        const itemPrice = item.price;
        if (itemPrice <= 0) continue;

        for (let j = intBudget; j >= itemPrice; j--) {
            const valueWithItem = dp[j - itemPrice].value + itemPrice;
            if (valueWithItem > dp[j].value) {
                dp[j] = {
                    value: valueWithItem,
                    items: [...dp[j - itemPrice].items, item]
                };
            }
        }
    }
    return dp[intBudget];
};

const formatProfitResults = (title, combination, budget) => {
    if(combination.items.length === 0) return `<div><h3>${title}</h3><p>No items to sell for this budget.</p></div>`;
    const summary = combination.items.reduce((acc, item) => {
        const key = `${item.name}|${item.quality}`;
        if (!acc[key]) acc[key] = { count: 0, price: item.price, name: item.name, quality: item.quality };
        acc[key].count++;
        return acc;
    }, {});
    const qualityClasses = { legendary: 'quality-legendary', epic: 'quality-epic', rare: 'quality-rare' };
    let resultHTML = `<div><h3>${title}</h3><ul>`;
    for (const key in summary) {
        const { count, price, name, quality } = summary[key];
        const borderClass = qualityClasses[quality] || '';
        const imgPath = getDishImagePath(name);
        resultHTML += `
            <li>
                <img src="${imgPath}" alt="${name}" class="${borderClass}">
                <span><b>${count}x</b></span>
                <span style="margin-left: auto;">${(price * count).toFixed(0)}</span>
            </li>`;
    }
    const totalValue = combination.value;
    resultHTML += `</ul>
        <p>Subtotal: <span class="subtotal-text">${totalValue.toFixed(0)}</span></p>
        <p>Remainder: <span class="under-budget-text">${(budget - totalValue).toFixed(0)}</span></p>
    </div>`;
    return resultHTML;
}

    const talentOptions = [ "0 (None)", "1 (5% faster)", "2 (10% faster)", "3 (15% faster)", "4 (20% faster)", "5 (25% faster)" ];
    const harvestTalentSelect = document.getElementById('harvestTalent');
    talentOptions.forEach((opt, index) => {

    });

    const commissionContainer = document.getElementById("commissionSelector");

    for (let i = 0; i < 7; i++) {
        const wrapper = document.createElement("div");
        wrapper.className = "dish-group";

        if (i === 0) commissionContainer.appendChild(wrapper);
        else reservedContainer.appendChild(wrapper);
    }


    initializeProfitTab();
  });
</script>
